<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GymPro — Workouts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0a0c10;--surface:#111318;--surface2:#191d26;--border:rgba(255,255,255,0.07);--text:#e8eaf0;--muted:#6b7280;--accent:#3b82f6;--accent2:#6366f1;--green:#22c55e;--red:#ef4444;--yellow:#eab308;--radius:14px;--sidebar-w:240px;--font-body:'DM Sans',sans-serif;--font-head:'Bebas Neue',sans-serif;--font-mono:'DM Mono',monospace;}
    [data-theme="light"]{--bg:#f0f2f7;--surface:#fff;--surface2:#f8fafc;--border:rgba(0,0,0,0.08);--text:#1a1f2e;--muted:#94a3b8;}
    html,body{height:100%;}
    body{font-family:var(--font-body);background:var(--bg);color:var(--text);display:flex;overflow:hidden;transition:background .3s,color .3s;}
    a{text-decoration:none;color:inherit;}
    ::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px;}

    /* SIDEBAR */
    .sidebar{width:var(--sidebar-w);min-height:100vh;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:28px 0 24px;position:fixed;top:0;left:0;bottom:0;z-index:100;}
    .sidebar-logo{display:flex;align-items:center;gap:10px;padding:0 20px 28px;border-bottom:1px solid var(--border);}
    .logo-icon{width:38px;height:38px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:10px;display:grid;place-items:center;font-size:16px;color:#fff;flex-shrink:0;}
    .logo-text{font-family:var(--font-head);font-size:22px;letter-spacing:1px;}.logo-text span{color:var(--accent);}
    .sidebar-section{padding:20px 12px 8px;}.sidebar-label{font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);padding:0 10px;margin-bottom:6px;}
    .sidebar a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;color:var(--muted);font-size:14px;font-weight:500;transition:all .18s;position:relative;}
    .sidebar a:hover{background:var(--surface2);color:var(--text);}.sidebar a.active{background:rgba(59,130,246,.12);color:var(--accent);}
    .sidebar a.active::before{content:'';position:absolute;left:0;top:25%;bottom:25%;width:3px;background:var(--accent);border-radius:0 3px 3px 0;}
    .sidebar a i{width:18px;text-align:center;font-size:15px;}
    .sidebar-footer{margin-top:auto;padding:16px 16px 0;border-top:1px solid var(--border);}
    .user-card{display:flex;align-items:center;gap:10px;padding:12px;background:var(--surface2);border-radius:10px;}
    .user-avatar{width:36px;height:36px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:50%;display:grid;place-items:center;font-size:14px;color:#fff;font-weight:700;flex-shrink:0;}
    .user-name{font-size:13px;font-weight:600;}.user-role{font-size:11px;color:var(--muted);}
    .logout-btn{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--red);font-size:12px;font-weight:500;cursor:pointer;padding:8px 12px;border-radius:8px;width:100%;margin-top:6px;font-family:var(--font-body);transition:background .15s;}
    .logout-btn:hover{background:rgba(239,68,68,.1);}

    /* MAIN */
    .main{margin-left:var(--sidebar-w);flex:1;height:100vh;overflow-y:auto;padding:32px 36px;}
    .topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:28px;gap:20px;}
    .page-title{font-family:var(--font-head);font-size:40px;letter-spacing:1px;line-height:1;}
    .page-sub{color:var(--muted);font-size:14px;margin-top:6px;}
    .topbar-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
    .icon-btn{width:38px;height:38px;background:var(--surface);border:1px solid var(--border);border-radius:10px;display:grid;place-items:center;cursor:pointer;color:var(--muted);font-size:15px;transition:all .15s;}
    .icon-btn:hover{color:var(--text);border-color:var(--accent);}
    .btn-primary{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;background:var(--accent);color:#fff;border:none;border-radius:9px;font-size:14px;font-weight:600;font-family:var(--font-body);cursor:pointer;transition:opacity .15s;}
    .btn-primary:hover{opacity:.88;}.btn-primary:disabled{opacity:.6;cursor:not-allowed;}

    /* FILTER TABS */
    .filter-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
    .filter-tab{padding:8px 16px;border:1px solid var(--border);background:var(--surface);border-radius:20px;color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;font-family:var(--font-body);transition:all .15s;}
    .filter-tab:hover{color:var(--text);border-color:var(--accent);}
    .filter-tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}

    /* SEARCH */
    .toolbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
    .search-wrap{position:relative;flex:1;}
    .search-wrap i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;}
    .search-input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:9px 12px 9px 34px;color:var(--text);font-size:13px;font-family:var(--font-body);outline:none;transition:border-color .15s;}
    .search-input::placeholder{color:var(--muted);}.search-input:focus{border-color:var(--accent);}

    /* WORKOUT CARDS */
    .workouts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;animation:fadeUp .4s ease both;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .workout-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:transform .2s,box-shadow .2s,border-color .2s;display:flex;flex-direction:column;}
    .workout-card:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(0,0,0,.3);}
    .wcard-top{height:4px;}
    .diff-beginner .wcard-top{background:linear-gradient(90deg,var(--green),#16a34a);}
    .diff-intermediate .wcard-top{background:linear-gradient(90deg,var(--yellow),#d97706);}
    .diff-advanced .wcard-top{background:linear-gradient(90deg,var(--red),#dc2626);}
    .wcard-header{padding:18px 20px 0;display:flex;align-items:flex-start;justify-content:space-between;}
    .wcard-icon{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-size:17px;flex-shrink:0;}
    .diff-beginner .wcard-icon{background:rgba(34,197,94,.15);color:var(--green);}
    .diff-intermediate .wcard-icon{background:rgba(234,179,8,.15);color:var(--yellow);}
    .diff-advanced .wcard-icon{background:rgba(239,68,68,.15);color:var(--red);}
    .diff-badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;}
    .diff-beginner .diff-badge{background:rgba(34,197,94,.12);color:var(--green);}
    .diff-intermediate .diff-badge{background:rgba(234,179,8,.12);color:var(--yellow);}
    .diff-advanced .diff-badge{background:rgba(239,68,68,.12);color:var(--red);}
    .wcard-body{padding:14px 20px;flex:1;}
    .wcard-name{font-size:15px;font-weight:700;margin-bottom:6px;}
    .wcard-desc{font-size:12.5px;color:var(--muted);line-height:1.5;margin-bottom:12px;}
    .wcard-meta{display:flex;gap:14px;flex-wrap:wrap;}
    .wcard-meta-item{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);}
    .wcard-meta-item i{color:var(--accent);font-size:11px;}
    .wcard-exercises{margin-top:12px;display:flex;flex-wrap:wrap;gap:5px;}
    .ex-tag{font-size:11px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:2px 8px;color:var(--muted);}
    .wcard-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
    .wcard-id{font-family:var(--font-mono);font-size:11px;color:var(--muted);}
    .action-btns{display:flex;gap:6px;}
    .act-btn{width:30px;height:30px;border:1px solid var(--border);border-radius:7px;background:none;color:var(--muted);font-size:12px;cursor:pointer;display:grid;place-items:center;transition:all .15s;}
    .act-btn:hover{background:var(--surface2);color:var(--accent);border-color:var(--accent);}
    .act-btn.danger:hover{border-color:var(--red);color:var(--red);}
    .empty-state{text-align:center;padding:60px;color:var(--muted);grid-column:1/-1;}
    .empty-state i{font-size:32px;margin-bottom:12px;display:block;opacity:.4;}

    /* MODAL */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);z-index:200;display:none;align-items:center;justify-content:center;}
    .modal-overlay.open{display:flex;}
    .modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;width:100%;max-width:500px;animation:fadeUp .3s ease;max-height:90vh;overflow-y:auto;}
    .modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
    .modal-title{font-family:var(--font-head);font-size:26px;letter-spacing:1px;}
    .modal-close{width:32px;height:32px;background:none;border:1px solid var(--border);border-radius:8px;color:var(--muted);cursor:pointer;display:grid;place-items:center;font-size:14px;transition:all .15s;}
    .modal-close:hover{color:var(--red);border-color:var(--red);}
    .form-group{margin-bottom:16px;}.form-label{font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:7px;}
    .form-control{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:11px 14px;color:var(--text);font-size:14px;font-family:var(--font-body);outline:none;transition:border-color .15s;}
    .form-control::placeholder{color:var(--muted);}.form-control:focus{border-color:var(--accent);}
    textarea.form-control{resize:vertical;min-height:80px;}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;padding-top:18px;border-top:1px solid var(--border);}
    .btn-ghost{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;background:none;border:1px solid var(--border);color:var(--muted);border-radius:9px;font-size:13px;font-family:var(--font-body);cursor:pointer;transition:all .15s;}
    .btn-ghost:hover{border-color:var(--accent);color:var(--text);}

    /* TOAST */
    .toast{position:fixed;bottom:24px;right:24px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 18px;font-size:13px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 30px rgba(0,0,0,.4);transform:translateY(80px);opacity:0;transition:all .3s ease;z-index:9999;}
    .toast.show{transform:translateY(0);opacity:1;}
    @media(max-width:520px){.form-row{grid-template-columns:1fr;}}
  </style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon"><i class="fas fa-dumbbell"></i></div>
    <div class="logo-text">GYM<span>PRO</span></div>
  </div>
  <div class="sidebar-section">
    <div class="sidebar-label">Main</div>
    <a href="dashboard.html"   data-role="admin,trainer"><i class="fas fa-chart-line"></i> Dashboard</a>
    <a href="member-home.html" data-role="member"><i class="fas fa-house"></i> My Home</a>
    <a href="members.html"     data-role="admin,trainer"><i class="fas fa-users"></i> Members</a>
    <a href="trainers.html"    data-role="admin,trainer"><i class="fas fa-person"></i> Trainers</a>
  </div>
  <div class="sidebar-section">
    <div class="sidebar-label">Finance</div>
    <a href="payments.html" data-role="admin,trainer"><i class="fas fa-credit-card"></i> Payments</a>
  </div>
  <div class="sidebar-section">
    <div class="sidebar-label">Tools</div>
    <a href="workouts.html" class="active" data-role="admin,trainer,member"><i class="fas fa-fire"></i> Workouts</a>
    <a href="chatbot.html"  data-role="admin,trainer,member"><i class="fas fa-robot"></i> AI Assistant</a>
  </div>
  <div class="sidebar-footer">
    <div class="user-card">
      <div class="user-avatar" id="userInitial">A</div>
      <div>
        <div class="user-name" id="sidebarUser">User</div>
        <div class="user-role" id="sidebarRole">Member</div>
      </div>
    </div>
    <button class="logout-btn" onclick="doLogout()">
      <i class="fas fa-arrow-right-from-bracket"></i> Log out
    </button>
  </div>
</aside>

<!-- MAIN -->
<main class="main">
  <div class="topbar">
    <div>
      <div class="page-title">WORKOUTS</div>
      <div class="page-sub" id="pageSubtitle">Browse all available workout programs</div>
    </div>
    <div class="topbar-right">
      <div class="icon-btn" onclick="toggleTheme()" id="themeBtn">🌜</div>
      <div class="icon-btn" onclick="loadWorkouts()" title="Refresh"><i class="fas fa-arrows-rotate"></i></div>
      <button class="btn-primary admin-trainer-only" onclick="openModal(null)">
        <i class="fas fa-plus"></i> Add Workout
      </button>
    </div>
  </div>

  <!-- Filter Tabs -->
  <div class="filter-tabs">
    <button class="filter-tab active" onclick="setFilter('all',this)">All</button>
    <button class="filter-tab" onclick="setFilter('beginner',this)">🟢 Beginner</button>
    <button class="filter-tab" onclick="setFilter('intermediate',this)">🟡 Intermediate</button>
    <button class="filter-tab" onclick="setFilter('advanced',this)">🔴 Advanced</button>
  </div>

  <!-- Search -->
  <div class="toolbar">
    <div class="search-wrap">
      <i class="fas fa-search"></i>
      <input class="search-input" id="searchInput"
        placeholder="Search workouts by name or category…" oninput="filterWorkouts()">
    </div>
  </div>

  <!-- Workouts Grid -->
  <div class="workouts-grid" id="workoutsGrid">
    <div class="empty-state">
      <i class="fas fa-spinner fa-spin"></i> Loading workouts…
    </div>
  </div>
</main>

<!-- ADD / EDIT MODAL (admin & trainer only) -->
<div class="modal-overlay" id="workoutModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">ADD WORKOUT</div>
      <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
    </div>
    <input type="hidden" id="editId">
    <div class="form-group">
      <label class="form-label">Workout Name *</label>
      <input type="text" id="fName" class="form-control" placeholder="e.g. Full Body Blast">
    </div>
    <div class="form-group">
      <label class="form-label">Description</label>
      <textarea id="fDesc" class="form-control" rows="3"
        placeholder="Brief description of this workout…"></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Difficulty</label>
        <select id="fDiff" class="form-control">
          <option value="beginner">Beginner</option>
          <option value="intermediate">Intermediate</option>
          <option value="advanced">Advanced</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Duration (mins)</label>
        <input type="number" id="fDuration" class="form-control" placeholder="e.g. 45" min="1">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Category</label>
        <select id="fCategory" class="form-control">
          <option value="strength">Strength</option>
          <option value="cardio">Cardio</option>
          <option value="flexibility">Flexibility</option>
          <option value="hiit">HIIT</option>
          <option value="yoga">Yoga</option>
          <option value="general">General</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Assign to Member ID</label>
        <input type="number" id="fMemberId" class="form-control" placeholder="Leave blank = all">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Exercises (comma separated)</label>
      <input type="text" id="fExercises" class="form-control"
        placeholder="e.g. Squats, Push-ups, Deadlifts">
    </div>
    <div class="modal-footer">
      <button class="btn-ghost" onclick="closeModal()">
        <i class="fas fa-times"></i> Cancel
      </button>
      <button class="btn-primary" id="saveBtn" onclick="saveWorkout()">
        <i class="fas fa-save"></i> Save Workout
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast">
  <i class="fas fa-check-circle" style="color:var(--green);"></i>
  <span id="toastMsg">Done!</span>
</div>

<script>
  const API = 'http://127.0.0.1:5000';
  let allWorkouts   = [];
  let activeFilter  = 'all';

  /* ── Auth ── */
  function getUser() {
    try {
      return JSON.parse(localStorage.getItem('gymUser'))
          || JSON.parse(localStorage.getItem('currentUser'))
          || null;
    } catch(e) { return null; }
  }

  /* ── apiFetch ── */
  function apiFetch(path, opts) {
    opts = opts || {};
    const user    = getUser();
    const headers = Object.assign({}, opts.headers || {});
    if (!headers['Content-Type'] && opts.body) headers['Content-Type'] = 'application/json';
    if (user) headers['X-User'] = JSON.stringify(user);
    return fetch(API + path, {
      credentials: 'include',
      method:  opts.method || 'GET',
      body:    opts.body   || undefined,
      headers: headers,
    });
  }

  /* ── Toast ── */
  function showToast(msg, type) {
    const t    = document.getElementById('toast');
    const icon = t.querySelector('i');
    icon.className   = type === 'error' ? 'fas fa-circle-xmark' : 'fas fa-check-circle';
    icon.style.color = type === 'error' ? 'var(--red)' : 'var(--green)';
    document.getElementById('toastMsg').textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
  }

  /* ── Category icons ── */
  const catIcons = {
    strength:'fa-dumbbell', cardio:'fa-heart-pulse', flexibility:'fa-person-walking',
    hiit:'fa-fire', yoga:'fa-spa', general:'fa-star', other:'fa-fire'
  };

  /* ── Load workouts ── */
  function loadWorkouts() {
    document.getElementById('workoutsGrid').innerHTML =
      '<div class="empty-state"><i class="fas fa-spinner fa-spin"></i> Loading…</div>';

    apiFetch('/workouts')
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(data => {
        allWorkouts = data;
        applyFilters();
      })
      .catch(err => {
        document.getElementById('workoutsGrid').innerHTML =
          `<div class="empty-state">
            <i class="fas fa-circle-xmark"></i>
            Failed to load: ${err.message}
          </div>`;
        showToast('Failed to load workouts', 'error');
      });
  }

  /* ── Filter ── */
  function setFilter(f, el) {
    activeFilter = f;
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    if (el) el.classList.add('active');
    applyFilters();
  }

  function filterWorkouts() { applyFilters(); }

  function applyFilters() {
    const q = (document.getElementById('searchInput').value || '').toLowerCase();
    let data = allWorkouts;

    if (activeFilter !== 'all') {
      data = data.filter(w => (w.difficulty || '').toLowerCase() === activeFilter);
    }
    if (q) {
      data = data.filter(w =>
        (w.name || '').toLowerCase().includes(q) ||
        (w.category || '').toLowerCase().includes(q) ||
        (w.description || '').toLowerCase().includes(q)
      );
    }
    renderCards(data);
  }

  /* ── Render cards ── */
  function renderCards(data) {
    const grid = document.getElementById('workoutsGrid');
    const role = getUser() ? getUser().role : 'member';
    const canEdit = role === 'admin' || role === 'trainer';

    if (!data.length) {
      grid.innerHTML = `<div class="empty-state">
        <i class="fas fa-dumbbell"></i>
        No workouts found.
        ${canEdit ? '<br><small style="margin-top:8px;display:block;">Click <strong>Add Workout</strong> to create one.</small>' : ''}
      </div>`;
      return;
    }

    grid.innerHTML = data.map(w => {
      const name = w.name || 'Untitled Workout';
      const diff = (w.difficulty || 'beginner').toLowerCase();
      const cat  = (w.category  || 'general').toLowerCase();
      const icon = catIcons[cat] || catIcons.general;
      const wid  = w.workout_id || w.id;

      // Exercises
      let exList = [];
      if (w.exercises) {
        exList = typeof w.exercises === 'string'
          ? w.exercises.split(',').map(s => s.trim()).filter(Boolean)
          : w.exercises;
      }
      const exTags = exList.slice(0, 5).map(e =>
        `<span class="ex-tag">${e}</span>`).join('');

      const actions = canEdit ? `
        <div class="action-btns">
          <button class="act-btn" title="Edit" onclick="editWorkout(${wid})">
            <i class="fas fa-pen"></i>
          </button>
          <button class="act-btn danger" title="Delete" onclick="deleteWorkout(${wid},'${name.replace(/'/g,"\\'")}')">
            <i class="fas fa-trash"></i>
          </button>
        </div>` : '';

      return `<div class="workout-card diff-${diff}">
        <div class="wcard-top"></div>
        <div class="wcard-header">
          <div class="wcard-icon"><i class="fas ${icon}"></i></div>
          <span class="diff-badge">${diff.charAt(0).toUpperCase()+diff.slice(1)}</span>
        </div>
        <div class="wcard-body">
          <div class="wcard-name">${name}</div>
          <div class="wcard-desc">${w.description || 'No description available.'}</div>
          <div class="wcard-meta">
            ${w.duration ? `<div class="wcard-meta-item"><i class="fas fa-clock"></i>${w.duration} min</div>` : ''}
            <div class="wcard-meta-item"><i class="fas fa-tag"></i>${(cat.charAt(0).toUpperCase()+cat.slice(1))}</div>
            ${w.member_id ? `<div class="wcard-meta-item"><i class="fas fa-user"></i>Member #${w.member_id}</div>`
                          : `<div class="wcard-meta-item"><i class="fas fa-users"></i>All members</div>`}
          </div>
          ${exTags ? `<div class="wcard-exercises">${exTags}</div>` : ''}
        </div>
        <div class="wcard-footer">
          <span class="wcard-id">#${wid}</span>
          ${actions}
        </div>
      </div>`;
    }).join('');
  }

  /* ── Modal ── */
  function openModal(w) {
    document.getElementById('editId').value    = w ? (w.workout_id || w.id || '') : '';
    document.getElementById('modalTitle').textContent = w ? 'EDIT WORKOUT' : 'ADD WORKOUT';
    document.getElementById('fName').value     = w ? (w.name || '') : '';
    document.getElementById('fDesc').value     = w ? (w.description || '') : '';
    document.getElementById('fDiff').value     = w ? (w.difficulty || 'beginner') : 'beginner';
    document.getElementById('fDuration').value = w ? (w.duration || '') : '';
    document.getElementById('fCategory').value = w ? (w.category || 'general') : 'general';
    document.getElementById('fMemberId').value = w ? (w.member_id || '') : '';

    // Exercises
    let exStr = '';
    if (w && w.exercises) {
      exStr = typeof w.exercises === 'string' ? w.exercises : w.exercises.join(', ');
    }
    document.getElementById('fExercises').value = exStr;
    document.getElementById('workoutModal').classList.add('open');
    setTimeout(() => document.getElementById('fName').focus(), 100);
  }

  function closeModal() { document.getElementById('workoutModal').classList.remove('open'); }

  function editWorkout(id) {
    const w = allWorkouts.find(x => (x.workout_id || x.id) === id);
    if (w) openModal(w);
    else showToast('Workout not found', 'error');
  }

  /* ── Save workout ── */
  function saveWorkout() {
    const id   = document.getElementById('editId').value;
    const name = document.getElementById('fName').value.trim();
    if (!name) { showToast('Workout name is required', 'error'); return; }

    // Parse exercises
    const exRaw = document.getElementById('fExercises').value;
    const exercises = exRaw ? exRaw.split(',').map(s => s.trim()).filter(Boolean) : [];

    const payload = {
      name,
      description: document.getElementById('fDesc').value.trim()     || null,
      difficulty:  document.getElementById('fDiff').value            || 'beginner',
      duration:    parseInt(document.getElementById('fDuration').value) || null,
      category:    document.getElementById('fCategory').value        || 'general',
      member_id:   parseInt(document.getElementById('fMemberId').value) || null,
      exercises,
    };

    const path   = id ? '/workouts/' + id : '/workouts';
    const method = id ? 'PUT' : 'POST';

    const btn = document.getElementById('saveBtn');
    btn.disabled  = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving…';

    apiFetch(path, { method, body: JSON.stringify(payload) })
      .then(r => {
        if (!r.ok) return r.json().then(e => { throw new Error(e.error || 'Save failed'); });
        return r.json();
      })
      .then(() => {
        closeModal();
        loadWorkouts();
        showToast(id ? 'Workout updated!' : 'Workout added successfully!');
      })
      .catch(e => showToast(e.message || 'Save failed', 'error'))
      .finally(() => {
        btn.disabled  = false;
        btn.innerHTML = '<i class="fas fa-save"></i> Save Workout';
      });
  }

  /* ── Delete workout ── */
  function deleteWorkout(id, name) {
    if (!confirm('Delete workout "' + name + '"? This cannot be undone.')) return;
    apiFetch('/workouts/' + id, { method: 'DELETE' })
      .then(r => { if (!r.ok) throw new Error('Delete failed'); return r.json(); })
      .then(() => { loadWorkouts(); showToast('Workout deleted'); })
      .catch(e => showToast(e.message || 'Delete failed', 'error'));
  }

  /* ── Theme & Logout ── */
  function toggleTheme() {
    const html = document.documentElement;
    const dark = html.getAttribute('data-theme') === 'dark';
    html.setAttribute('data-theme', dark ? 'light' : 'dark');
    document.getElementById('themeBtn').textContent = dark ? '🌞' : '🌜';
    localStorage.setItem('gymTheme', dark ? 'light' : 'dark');
  }
  function doLogout() {
    apiFetch('/logout', { method: 'POST' }).catch(() => {}).finally(() => {
      localStorage.removeItem('gymUser');
      localStorage.removeItem('currentUser');
      window.location.href = 'login.html';
    });
  }

  /* ── Init ── */
  document.addEventListener('DOMContentLoaded', () => {
    const theme = localStorage.getItem('gymTheme') || 'dark';
    document.documentElement.setAttribute('data-theme', theme);
    document.getElementById('themeBtn').textContent = theme === 'dark' ? '🌜' : '🌞';

    const user = getUser();
    if (!user) { window.location.href = 'login.html'; return; }

    const name = user.username || 'User';
    const role = user.role || 'member';
    document.getElementById('sidebarUser').textContent = name;
    document.getElementById('userInitial').textContent = name[0].toUpperCase();
    document.getElementById('sidebarRole').textContent = role.charAt(0).toUpperCase() + role.slice(1);

    if (role === 'member') {
      document.getElementById('pageSubtitle').textContent = 'Your personalised workout programs';
    }

    // Hide elements based on role
    if (role !== 'admin') document.querySelectorAll('.admin-only').forEach(e => e.style.display='none');
    if (role !== 'admin' && role !== 'trainer') {
      document.querySelectorAll('.admin-trainer-only').forEach(e => e.style.display='none');
    }
    document.querySelectorAll('[data-role]').forEach(el => {
      if (!el.getAttribute('data-role').includes(role)) el.style.display = 'none';
    });

    // Close modal on backdrop click
    document.getElementById('workoutModal').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });

    loadWorkouts();
  });
</script>
</body>
</html>
