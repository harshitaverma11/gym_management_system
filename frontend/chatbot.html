<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GymPro — AI Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0a0c10;--surface:#111318;--surface2:#191d26;--border:rgba(255,255,255,0.07);--text:#e8eaf0;--muted:#6b7280;--accent:#3b82f6;--accent2:#6366f1;--green:#22c55e;--red:#ef4444;--yellow:#eab308;--radius:14px;--sidebar-w:240px;--font-body:'DM Sans',sans-serif;--font-head:'Bebas Neue',sans-serif;--font-mono:'DM Mono',monospace;}
    [data-theme="light"]{--bg:#f0f2f7;--surface:#fff;--surface2:#f8fafc;--border:rgba(0,0,0,0.08);--text:#1a1f2e;--muted:#94a3b8;}
    html,body{height:100%;}body{font-family:var(--font-body);background:var(--bg);color:var(--text);display:flex;overflow:hidden;}a{text-decoration:none;color:inherit;}
    ::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px;}
    .sidebar{width:var(--sidebar-w);min-height:100vh;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:28px 0 24px;position:fixed;top:0;left:0;bottom:0;z-index:100;}
    .sidebar-logo{display:flex;align-items:center;gap:10px;padding:0 20px 28px;border-bottom:1px solid var(--border);}
    .logo-icon{width:38px;height:38px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:10px;display:grid;place-items:center;font-size:16px;color:#fff;flex-shrink:0;}
    .logo-text{font-family:var(--font-head);font-size:22px;letter-spacing:1px;}.logo-text span{color:var(--accent);}
    .sidebar-section{padding:20px 12px 8px;}.sidebar-label{font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);padding:0 10px;margin-bottom:6px;}
    .sidebar a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;color:var(--muted);font-size:14px;font-weight:500;transition:all .18s;position:relative;}
    .sidebar a:hover{background:var(--surface2);color:var(--text);}.sidebar a.active{background:rgba(59,130,246,.12);color:var(--accent);}
    .sidebar a.active::before{content:'';position:absolute;left:0;top:25%;bottom:25%;width:3px;background:var(--accent);border-radius:0 3px 3px 0;}
    .sidebar a i{width:18px;text-align:center;font-size:15px;}
    .sidebar-footer{margin-top:auto;padding:16px 16px 0;border-top:1px solid var(--border);}
    .user-card{display:flex;align-items:center;gap:10px;padding:12px;background:var(--surface2);border-radius:10px;}
    .user-avatar{width:36px;height:36px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:50%;display:grid;place-items:center;font-size:14px;color:#fff;font-weight:700;flex-shrink:0;}
    .user-name{font-size:13px;font-weight:600;}.user-role{font-size:11px;color:var(--muted);}
    .logout-btn{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--red);font-size:12px;font-weight:500;cursor:pointer;padding:8px 12px;border-radius:8px;width:100%;margin-top:6px;font-family:var(--font-body);}
    .logout-btn:hover{background:rgba(239,68,68,.1);}

    /* CHAT LAYOUT */
    .main{margin-left:var(--sidebar-w);flex:1;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
    .chat-header{padding:20px 32px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:var(--surface);}
    .chat-header-left{display:flex;align-items:center;gap:14px;}
    .bot-avatar{width:44px;height:44px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:12px;display:grid;place-items:center;font-size:18px;color:#fff;position:relative;}
    .bot-status{position:absolute;bottom:-2px;right:-2px;width:12px;height:12px;background:var(--green);border:2px solid var(--surface);border-radius:50%;}
    .chat-header-info h2{font-size:16px;font-weight:700;}
    .chat-header-info p{font-size:12.5px;color:var(--muted);}
    .header-actions{display:flex;gap:8px;}
    .icon-btn{width:36px;height:36px;background:var(--surface2);border:1px solid var(--border);border-radius:9px;display:grid;place-items:center;cursor:pointer;color:var(--muted);font-size:14px;transition:all .15s;}
    .icon-btn:hover{color:var(--text);border-color:var(--accent);}

    /* MESSAGES */
    .chat-messages{flex:1;overflow-y:auto;padding:24px 32px;display:flex;flex-direction:column;gap:16px;}
    .msg{display:flex;gap:12px;align-items:flex-end;animation:msgIn .25s ease both;}
    @keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .msg.user{flex-direction:row-reverse;}
    .msg-avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0;}
    .msg.bot .msg-avatar{background:linear-gradient(135deg,var(--accent),var(--accent2));}
    .msg.user .msg-avatar{background:linear-gradient(135deg,var(--green),#16a34a);}
    .msg-bubble{max-width:72%;padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.6;}
    .msg.bot .msg-bubble{background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:4px;}
    .msg.user .msg-bubble{background:var(--accent);color:#fff;border-bottom-right-radius:4px;}
    .msg-time{font-size:11px;color:var(--muted);margin-top:4px;text-align:right;}
    .msg.bot .msg-time{text-align:left;}

    /* TYPING */
    .typing-indicator{display:flex;align-items:center;gap:4px;padding:14px 16px;}
    .typing-dot{width:7px;height:7px;background:var(--muted);border-radius:50%;animation:typingPulse 1.2s ease-in-out infinite;}
    .typing-dot:nth-child(2){animation-delay:.2s;}
    .typing-dot:nth-child(3){animation-delay:.4s;}
    @keyframes typingPulse{0%,80%,100%{transform:scale(1);opacity:.5;}40%{transform:scale(1.2);opacity:1;}}

    /* SUGGESTIONS */
    .suggestions{padding:0 32px 16px;display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0;}
    .suggest-btn{padding:8px 14px;background:var(--surface);border:1px solid var(--border);border-radius:20px;color:var(--muted);font-size:12.5px;font-family:var(--font-body);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:6px;}
    .suggest-btn:hover{color:var(--text);border-color:var(--accent);background:rgba(59,130,246,.05);}
    .suggest-btn i{color:var(--accent);font-size:11px;}

    /* INPUT */
    .chat-input-area{padding:16px 32px 20px;border-top:1px solid var(--border);flex-shrink:0;background:var(--surface);}
    .input-wrap{display:flex;gap:10px;align-items:flex-end;background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:10px 14px;transition:border-color .15s;}
    .input-wrap:focus-within{border-color:var(--accent);}
    #chatInput{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:14px;font-family:var(--font-body);resize:none;max-height:120px;line-height:1.5;}
    #chatInput::placeholder{color:var(--muted);}
    .send-btn{width:36px;height:36px;background:var(--accent);border:none;border-radius:9px;color:#fff;font-size:14px;cursor:pointer;display:grid;place-items:center;flex-shrink:0;transition:opacity .15s,transform .15s;}
    .send-btn:hover{opacity:.9;transform:scale(1.05);}
    .send-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}

    /* WELCOME */
    .welcome-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:16px;text-align:center;padding:40px;}
    .welcome-icon{width:64px;height:64px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:18px;display:grid;place-items:center;font-size:26px;color:#fff;margin-bottom:8px;}
    .welcome-title{font-family:var(--font-head);font-size:32px;letter-spacing:1px;}
    .welcome-sub{color:var(--muted);font-size:14px;max-width:360px;line-height:1.6;}

    @media(max-width:860px){.sidebar{transform:translateX(-100%)}.main{margin-left:0;}.chat-messages{padding:16px;}.chat-input-area{padding:12px 16px 16px;}.suggestions{padding:0 16px 12px;}}
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-logo"><div class="logo-icon"><i class="fas fa-dumbbell"></i></div><div class="logo-text">GYM<span>PRO</span></div></div>
    <div class="sidebar-section"><div class="sidebar-label">Main</div>
      <a href="dashboard.html"><i class="fas fa-chart-line"></i> Dashboard</a>
      <a href="members.html" data-role="admin,trainer"><i class="fas fa-users"></i> Members</a>
      <a href="trainers.html" data-role="admin,trainer"><i class="fas fa-person"></i> Trainers</a>
    </div>
    <div class="sidebar-section"><div class="sidebar-label">Finance</div>
      <a href="payments.html" data-role="admin,trainer"><i class="fas fa-credit-card"></i> Payments</a>
    </div>
    <div class="sidebar-section"><div class="sidebar-label">Tools</div>
      <a href="workouts.html"><i class="fas fa-fire"></i> Workouts</a>
      <a href="chatbot.html" class="active"><i class="fas fa-robot"></i> AI Assistant</a>
    </div>
    <div class="sidebar-footer">
      <div class="user-card"><div class="user-avatar" id="userInitial">A</div><div><div class="user-name" id="sidebarUser">Admin</div><div class="user-role" id="sidebarRole">Administrator</div></div></div>
      <button class="logout-btn" onclick="doLogout()"><i class="fas fa-arrow-right-from-bracket"></i> Log out</button>
    </div>
  </aside>

  <div class="main">
    <!-- Chat Header -->
    <div class="chat-header">
      <div class="chat-header-left">
        <div class="bot-avatar"><i class="fas fa-robot"></i><div class="bot-status"></div></div>
        <div class="chat-header-info"><h2>GymPro AI Assistant</h2><p>Always ready to help — ask me anything</p></div>
      </div>
      <div class="header-actions">
        <div class="icon-btn" onclick="clearChat()" title="Clear chat"><i class="fas fa-trash-can"></i></div>
        <div class="icon-btn" onclick="toggleTheme()" id="themeBtn">🌜</div>
      </div>
    </div>

    <!-- Messages -->
    <div class="chat-messages" id="chatMessages">
      <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-icon"><i class="fas fa-robot"></i></div>
        <div class="welcome-title">GymPro AI</div>
        <div class="welcome-sub">Your intelligent gym management assistant. Ask about members, revenue, workouts, schedules, or anything else.</div>
      </div>
    </div>

    <!-- Suggestions -->
    <div class="suggestions" id="suggestions">
      <button class="suggest-btn" onclick="sendSuggestion(this)"><i class="fas fa-users"></i> How many active members?</button>
      <button class="suggest-btn" onclick="sendSuggestion(this)"><i class="fas fa-indian-rupee-sign"></i> Monthly revenue</button>
      <button class="suggest-btn" onclick="sendSuggestion(this)"><i class="fas fa-dumbbell"></i> Best workout for beginners</button>
      <button class="suggest-btn" onclick="sendSuggestion(this)"><i class="fas fa-triangle-exclamation"></i> Pending payments</button>
    </div>

    <!-- Input -->
    <div class="chat-input-area">
      <div class="input-wrap">
        <textarea id="chatInput" placeholder="Ask me anything about your gym…" rows="1" oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
      </div>
    </div>
  </div>

  <script>
    const API = 'http://127.0.0.1:5000';
    let isTyping = false;
    let userInitials = 'U';

    function getUser(){ try{return JSON.parse(localStorage.getItem('gymUser'))||JSON.parse(localStorage.getItem('currentUser'));}catch{return null;} }
    function apiFetch(path, opts) {
      opts = opts || {};
      const user = getUser();
      const headers = Object.assign({}, opts.headers || {});
      if (!headers['Content-Type'] && opts.body) headers['Content-Type'] = 'application/json';
      if (user) headers['X-User'] = JSON.stringify(user);
      return fetch(API + path, { credentials: 'include', method: opts.method || 'GET', body: opts.body, headers });
    }

    function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px';}

    function timeNow(){return new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});}

    function hideWelcome(){
      const ws=document.getElementById('welcomeScreen');
      if(ws)ws.style.display='none';
    }

    function appendMessage(text,sender='bot'){
      hideWelcome();
      const container=document.getElementById('chatMessages');
      const msg=document.createElement('div');
      msg.className=`msg ${sender}`;
      const initials=sender==='bot'?'AI':userInitials;
      msg.innerHTML=`
        <div class="msg-avatar">${initials}</div>
        <div>
          <div class="msg-bubble">${text}</div>
          <div class="msg-time">${timeNow()}</div>
        </div>`;
      container.appendChild(msg);
      container.scrollTop=container.scrollHeight;
      return msg;
    }

    function showTyping(){
      hideWelcome();
      const container=document.getElementById('chatMessages');
      const el=document.createElement('div');
      el.className='msg bot';el.id='typingIndicator';
      el.innerHTML=`<div class="msg-avatar">AI</div><div class="msg-bubble"><div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div>`;
      container.appendChild(el);
      container.scrollTop=container.scrollHeight;
    }
    function removeTyping(){const el=document.getElementById('typingIndicator');if(el)el.remove();}

    function sendSuggestion(btn){
      document.getElementById('chatInput').value=btn.textContent.trim();
      sendMessage();
    }

    async function sendMessage(){
      const input=document.getElementById('chatInput');
      const text=input.value.trim();
      if(!text||isTyping)return;
      input.value='';input.style.height='auto';
      appendMessage(text,'user');
      document.getElementById('suggestions').style.display='none';
      isTyping=true;
      document.getElementById('sendBtn').disabled=true;
      showTyping();

      try{
        // Try backend chat endpoint
        const res=await apiFetch('/chat',{
          method:'POST',
          body:JSON.stringify({message:text})
        });
        removeTyping();
        if(res.ok){
          const data=await res.json();
          const reply=data.reply||data.message||data.response||'I received your message.';
          appendMessage(reply,'bot');
        } else {
          // Fallback: smart local responses
          const reply=localReply(text);
          appendMessage(reply,'bot');
        }
      } catch {
        removeTyping();
        const reply=localReply(text);
        appendMessage(reply,'bot');
      }

      isTyping=false;
      document.getElementById('sendBtn').disabled=false;
    }

    function localReply(text){
      const t=text.toLowerCase();
      if(t.includes('member')&&(t.includes('how many')||t.includes('count')||t.includes('total')))
        return 'To check your total members, head over to the <a href="members.html" style="color:var(--accent);">Members page</a>. You can also see the count on the Dashboard.';
      if(t.includes('revenue')||t.includes('income')||t.includes('money'))
        return 'Monthly revenue is displayed on your <a href="dashboard.html" style="color:var(--accent);">Dashboard</a> and in detail on the <a href="payments.html" style="color:var(--accent);">Payments page</a>.';
      if(t.includes('workout')||t.includes('exercise')||t.includes('fitness'))
        return 'Browse all workout plans on the <a href="workouts.html" style="color:var(--accent);">Workouts page</a>. You can filter by difficulty — Beginner, Intermediate, or Advanced.';
      if(t.includes('trainer'))
        return 'You can view and manage all trainers on the <a href="trainers.html" style="color:var(--accent);">Trainers page</a>.';
      if(t.includes('payment')||t.includes('due')||t.includes('pending'))
        return 'Check pending and due payments on the <a href="payments.html" style="color:var(--accent);">Payments page</a>. You can also mark payments as paid there.';
      if(t.includes('dashboard'))
        return 'Your <a href="dashboard.html" style="color:var(--accent);">Dashboard</a> shows an overview of members, trainers, revenue, and due payments in real time.';
      if(t.includes('hello')||t.includes('hi')||t.includes('hey'))
        return `Hello! 👋 I'm the GymPro AI assistant. Ask me anything about your gym — members, payments, workouts, or trainers.`;
      if(t.includes('help'))
        return 'I can help you with: member management, payment tracking, workout plans, trainer schedules, and dashboard insights. What do you need?';
      return `I can help with questions about members, payments, workouts, and trainers. Try asking "How many members do we have?" or "Show pending payments".`;
    }

    function clearChat(){
      const container=document.getElementById('chatMessages');
      container.innerHTML=`<div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-icon"><i class="fas fa-robot"></i></div>
        <div class="welcome-title">GymPro AI</div>
        <div class="welcome-sub">Your intelligent gym management assistant. Ask about members, revenue, workouts, schedules, or anything else.</div>
      </div>`;
      document.getElementById('suggestions').style.display='flex';
    }

    function doLogout(){apiFetch('/logout',{method:'POST'}).catch(()=>{}).finally(()=>{localStorage.removeItem('gymUser');localStorage.removeItem('currentUser');window.location.href='login.html';});}
    function toggleTheme(){const html=document.documentElement;const isDark=html.getAttribute('data-theme')==='dark';html.setAttribute('data-theme',isDark?'light':'dark');document.getElementById('themeBtn').textContent=isDark?'🌞':'🌜';localStorage.setItem('gymTheme',isDark?'light':'dark');}

    document.getElementById('chatInput').addEventListener('keydown',e=>{
      if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}
    });

    document.addEventListener('DOMContentLoaded',()=>{
      const theme=localStorage.getItem('gymTheme')||'dark';
      document.documentElement.setAttribute('data-theme',theme);
      document.getElementById('themeBtn').textContent=theme==='dark'?'🌜':'🌞';
      const user=getUser();
      if(!user){window.location.href='login.html';return;}
      const name=user.username||user.name||'User';
      userInitials=name[0].toUpperCase();
      document.getElementById('sidebarUser').textContent=name;
      document.getElementById('userInitial').textContent=userInitials;
      document.getElementById('sidebarRole').textContent=(user.role||'user').charAt(0).toUpperCase()+(user.role||'user').slice(1);
      document.querySelectorAll('[data-role]').forEach(el=>{if(!el.getAttribute('data-role').includes(user.role))el.style.display='none';});
    });
  </script>
</body>
</html>
